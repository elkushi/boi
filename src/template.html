<style>
:root{
  --void:#0B0A12; --deep:#171424; --stone:#2A2438;
  --cream:#F5EFE4; --cream-2:#E4D9C6;
  --blood:#C0202B; --blood-lo:#7E0E16;
  --gold:#F2B93B; --gold-lo:#B9821A;
  --jade:#43A047; --jade-lo:#2E7031;
  --ice:#5BA7D6;
  --disp:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --ui:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  --s:1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--cream);font-family:var(--ui);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(130% 100% at 50% 10%,#2E2440 0%,#171424 55%,#07060D 100%)}
#wrap{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  overflow:hidden;box-shadow:0 calc(18px*var(--s)) calc(60px*var(--s)) rgba(0,0,0,.7)}
canvas{display:block;width:100%;height:100%}

/* ---------- health bars ---------- */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(14px*var(--s))}
.bars{display:flex;align-items:flex-start;gap:calc(12px*var(--s))}
.side{flex:1;min-width:0}
.side.r{direction:rtl}
.side.r .nm,.side.r .hpwrap,.side.r .pips{direction:ltr}
.nm{display:flex;align-items:center;gap:calc(8px*var(--s));margin-bottom:calc(5px*var(--s))}
.side.r .nm{flex-direction:row-reverse}
.nm img{width:calc(38px*var(--s));height:calc(38px*var(--s));border-radius:calc(8px*var(--s));
  object-fit:cover;border:calc(2px*var(--s)) solid rgba(255,255,255,.25);display:block}
.nm b{font-family:var(--disp);font-weight:600;font-size:calc(19px*var(--s));color:#fff;
  letter-spacing:.02em}
.hpwrap{height:calc(26px*var(--s));background:rgba(8,7,14,.85);
  border:calc(3px*var(--s)) solid rgba(255,255,255,.2);border-radius:calc(6px*var(--s));
  overflow:hidden;position:relative}
.hpwrap i{position:absolute;inset:0;transform-origin:left center;
  background:linear-gradient(180deg,#5FD16B,#2E8B3C);transition:transform .12s linear}
.side.r .hpwrap i{transform-origin:right center}
.hpwrap u{position:absolute;inset:0;transform-origin:left center;
  background:rgba(224,60,48,.55);transition:transform .5s ease .25s}
.side.r .hpwrap u{transform-origin:right center}
.hpwrap.low i{background:linear-gradient(180deg,#E8C13D,#C98F1E)}
.hpwrap.crit i{background:linear-gradient(180deg,#E8584A,#A51D18)}
.pips{display:flex;gap:calc(6px*var(--s));margin-top:calc(6px*var(--s))}
.side.r .pips{justify-content:flex-end}
.pip{width:calc(16px*var(--s));height:calc(16px*var(--s));border-radius:50%;
  background:rgba(255,255,255,.16);border:calc(2px*var(--s)) solid rgba(255,255,255,.22)}
.pip.win{background:var(--gold);border-color:#fff}

.centre{position:absolute;left:50%;top:calc(16px*var(--s));transform:translateX(-50%);
  text-align:center}
.timer{font-family:var(--disp);font-weight:700;font-size:calc(42px*var(--s));
  color:#fff;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 calc(3px*var(--s)) 0 rgba(0,0,0,.6)}
.score{font-size:calc(11.5px*var(--s));letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-top:calc(2px*var(--s))}

#shout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  font-family:var(--disp);font-weight:700;font-size:calc(92px*var(--s));color:#fff;
  letter-spacing:.04em;text-shadow:0 calc(6px*var(--s)) 0 var(--blood-lo),
  0 0 calc(40px*var(--s)) rgba(192,32,43,.8);opacity:0;pointer-events:none;white-space:nowrap}
#shout.go{animation:shout .9s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes shout{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.02)}
}

/* ---------- touch ---------- */
#touch{position:absolute;inset:auto 0 0 0;padding:calc(14px*var(--s));
  display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#touch[hidden]{display:none}
#touch .grp{display:flex;gap:calc(9px*var(--s));pointer-events:auto}
.tb{width:max(58px,calc(70px*var(--s)));height:max(58px,calc(70px*var(--s)));
  border-radius:calc(15px*var(--s));background:rgba(20,16,32,.74);
  border:calc(3px*var(--s)) solid rgba(255,255,255,.22);color:#fff;
  font-family:var(--disp);font-size:calc(20px*var(--s));font-weight:600;
  display:grid;place-items:center;box-shadow:0 calc(4px*var(--s)) 0 rgba(0,0,0,.5);opacity:.9}
.tb:active{transform:translateY(calc(3px*var(--s)));box-shadow:none}
.tb.p{background:rgba(192,32,43,.85)}
.tb.k{background:rgba(242,185,59,.85);color:#2A2438}
.tb.b{background:rgba(91,167,214,.85)}
.tb small{display:block;font-size:calc(9.5px*var(--s));letter-spacing:.1em;opacity:.85}

/* ---------- overlay ---------- */
#ov{position:absolute;inset:0;display:grid;place-items:center;padding:calc(22px*var(--s));
  background:rgba(7,6,13,.82);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s}
#ov.on{opacity:1;pointer-events:auto}
.panel{width:min(calc(620px*var(--s)),94%);background:var(--cream);color:#241E33;
  border-radius:calc(20px*var(--s));padding:calc(28px*var(--s)) calc(32px*var(--s)) calc(24px*var(--s));
  border:calc(4px*var(--s)) solid #fff;text-align:center;
  box-shadow:0 calc(10px*var(--s)) 0 var(--cream-2),0 calc(26px*var(--s)) calc(60px*var(--s)) rgba(0,0,0,.6);
  transform:translateY(calc(14px*var(--s)));transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
#ov.on .panel{transform:translateY(0)}
.panel .eyebrow{font-size:calc(12px*var(--s));letter-spacing:.2em;text-transform:uppercase;
  color:var(--blood);font-weight:700;margin:0 0 calc(8px*var(--s));max-width:none}
.panel h1{font-family:var(--disp);font-weight:700;margin:0 0 calc(8px*var(--s));
  font-size:calc(44px*var(--s));line-height:1.02;color:#241E33;text-wrap:balance}
.panel p{margin:0 auto calc(16px*var(--s));font-size:calc(16px*var(--s));line-height:1.55;
  max-width:calc(420px*var(--s));color:#4A4162;text-wrap:pretty}
.btn{font-family:var(--disp);font-weight:600;font-size:calc(21px*var(--s));
  background:var(--blood);color:#fff;border:0;border-radius:calc(13px*var(--s));
  padding:calc(13px*var(--s)) calc(34px*var(--s));cursor:pointer;
  box-shadow:0 calc(5px*var(--s)) 0 var(--blood-lo)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(calc(4px*var(--s)));box-shadow:0 calc(1px*var(--s)) 0 var(--blood-lo)}
.btn.ghost{background:transparent;color:#5A5078;box-shadow:none;
  border:calc(2px*var(--s)) solid var(--cream-2);font-size:calc(16px*var(--s));
  padding:calc(10px*var(--s)) calc(20px*var(--s))}
.stack{display:flex;flex-direction:column;gap:calc(10px*var(--s));align-items:center}
.duo{display:flex;align-items:center;justify-content:center;gap:calc(14px*var(--s));
  margin-bottom:calc(14px*var(--s))}
.duo img{width:calc(76px*var(--s));height:calc(76px*var(--s));border-radius:calc(15px*var(--s));
  object-fit:cover;border:calc(4px*var(--s)) solid #fff;
  box-shadow:0 calc(5px*var(--s)) calc(14px*var(--s)) rgba(0,0,0,.4)}
.duo span{font-family:var(--disp);font-size:calc(26px*var(--s));color:var(--blood);font-weight:700}
.code{font-family:var(--disp);font-weight:700;font-size:calc(56px*var(--s));
  letter-spacing:.18em;color:#241E33;background:#fff;border-radius:calc(14px*var(--s));
  border:calc(3px*var(--s)) dashed var(--cream-2);padding:calc(10px*var(--s)) calc(22px*var(--s));
  margin:calc(6px*var(--s)) 0}
input.code-in{font-family:var(--disp);font-weight:700;font-size:calc(32px*var(--s));
  letter-spacing:.2em;text-align:center;text-transform:uppercase;width:calc(220px*var(--s));
  border:calc(3px*var(--s)) solid var(--cream-2);border-radius:calc(12px*var(--s));
  padding:calc(9px*var(--s));color:#241E33;background:#fff}
.who{display:flex;gap:calc(8px*var(--s));justify-content:center;margin:calc(4px*var(--s)) 0}
.who button{font-family:var(--ui);font-weight:600;font-size:calc(14px*var(--s));
  background:#fff;border:calc(2px*var(--s)) solid var(--cream-2);color:#241E33;
  border-radius:99px;padding:calc(8px*var(--s)) calc(16px*var(--s));cursor:pointer}
.who button.sel{background:#241E33;color:#fff;border-color:#241E33}
.tally{display:flex;justify-content:center;gap:calc(26px*var(--s));
  margin:calc(2px*var(--s)) 0 calc(18px*var(--s))}
.tally b{display:block;font-family:var(--disp);font-size:calc(34px*var(--s));
  color:#241E33;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tally span{font-size:calc(11px*var(--s));letter-spacing:.14em;text-transform:uppercase;
  color:#7A6F96;font-weight:600}
.keys{display:flex;gap:calc(12px*var(--s));justify-content:center;flex-wrap:wrap;
  margin-top:calc(12px*var(--s));font-size:calc(12.5px*var(--s));color:#5A5078}
kbd{font-family:var(--ui);font-weight:700;font-size:calc(11px*var(--s));background:#fff;
  border:calc(2px*var(--s)) solid var(--cream-2);border-bottom-width:calc(4px*var(--s));
  border-radius:calc(6px*var(--s));padding:calc(3px*var(--s)) calc(7px*var(--s));color:#241E33}
.dots{font-size:calc(14px*var(--s));color:#7A6F96;margin-top:calc(6px*var(--s))}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;
  background:var(--void);color:var(--cream);z-index:60;padding:34px}
#rotate svg{width:72px;height:72px;margin-bottom:18px;animation:tip 2.4s ease-in-out infinite}
#rotate h2{font-family:var(--disp);font-weight:600;font-size:1.6rem;margin:0 0 .5rem;color:#fff}
#rotate p{margin:0;font-size:.96rem;line-height:1.6;color:#A79BC4}
@keyframes tip{0%,55%,100%{transform:rotate(0)}25%,40%{transform:rotate(-90deg)}}
@media (orientation:portrait){ #rotate.armed{display:grid} }
@media (prefers-reduced-motion:reduce){
  #ov,.panel,.btn,.hpwrap i,.hpwrap u{transition:none}
  #shout.go{animation:none;opacity:1}
  #rotate svg{animation:none;transform:rotate(-90deg)}
}
</style>

<script>
/* ============================================================
   БОЙ — файтинг на двоих через интернет.
   Каждый телефон считает своего бойца. Попадание решает
   АТАКУЮЩИЙ и присылает событие: тогда свой удар всегда
   отзывается мгновенно и не теряется из-за задержки.
   ============================================================ */
const CFG = {
  p1:'Мустафа', p2:'Алиса',
  rounds:2,              // побед до победы в матче (best of 3)
  roundSecs:60,
};
const SPRITES = /*__SPRITES__*/{};
const FB      = /*__FIREBASE__*/null;
const IMG={};

const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
const VW=1280, VH=720, GND=556;

/* ---------- палитра ---------- */
const C={ skin:'#E0A878', stone:'#4A4160', stone2:'#5C5178', wood:'#6B4A32',
          blood:'#C0202B', gold:'#F2B93B', ice:'#5BA7D6', bone:'#E8DFCF' };
function hx2(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(h,t,a){const c=hx2(h),d=hx2(t);
  return `rgb(${Math.round(c[0]+(d[0]-c[0])*a)},${Math.round(c[1]+(d[1]-c[1])*a)},${Math.round(c[2]+(d[2]-c[2])*a)})`;}
const _cc=new Map();
function shade(h,t,a){let m=_cc.get(h); if(!m){m=new Map();_cc.set(h,m);}
  let n=m.get(t); if(!n){n=new Map();m.set(t,n);}
  let v=n.get(a); if(v===undefined){v=mix(h,t,a);n.set(a,v);} return v;}
const lite=(h,a)=>shade(h,'#ffffff',a), dark=(h,a)=>shade(h,'#0B0A12',a);
function part(x,y,w,h,col,d){
  d=d||12;
  ctx.fillStyle=dark(col,.32);
  ctx.beginPath(); ctx.moveTo(x+w,y); ctx.lineTo(x+w+d,y-d);
  ctx.lineTo(x+w+d,y+h-d); ctx.lineTo(x+w,y+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle=lite(col,.22);
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+d,y-d);
  ctx.lineTo(x+w+d,y-d); ctx.lineTo(x+w,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=col; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=dark(col,.14); ctx.fillRect(x,y+h*.74,w,h*.26);
  ctx.strokeStyle=dark(col,.45); ctx.lineWidth=1.5; ctx.strokeRect(x+.75,y+.75,w-1.5,h-1.5);
}

/* ---------- звук ---------- */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,type,vol,slide,delay){
  const a=ac(); if(!a||muted) return;
  const t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.05,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
}
function noise(dur,vol,hp){
  const a=ac(); if(!a||muted) return;
  const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const g=a.createGain(); g.gain.value=vol||.08;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SFX={
  swing:()=>tone(260,.09,'sawtooth',.03,180),
  hit:  ()=>{noise(.12,.11,700); tone(110,.14,'square',.07,-50);},
  heavy:()=>{noise(.2,.14,400); tone(80,.22,'square',.09,-36);},
  block:()=>{noise(.09,.07,2200); tone(620,.08,'square',.04,120);},
  jump: ()=>tone(420,.08,'square',.035,180),
  ko:   ()=>{[220,165,110].forEach((f,i)=>tone(f,.42,'sawtooth',.07,0,i*.14)); noise(.5,.1,200);},
  round:()=>{[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.05,0,i*.1));},
  win:  ()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.06,0,i*.12));},
};

/* ---------- бойцы ---------- */
const FW=84, FH=214;                       // хитбокс бойца (крупно — играем с телефона)
const SPD=330, JUMPV=820, GRAV=2100;
const MOVES = {
  punch:{ wind:.10, active:.07, rec:.16, dmg:7,  reach:96,  kb:170, up:0,   h:74, name:'удар' },
  kick: { wind:.17, active:.09, rec:.26, dmg:13, reach:136, kb:360, up:140, h:112, name:'нога' },
};
function mkF(name,x,face,sprR,sprL,sprF){
  return {name,x,y:GND-FH,vx:0,vy:0,face,on:true,hp:100,
          atk:null,t:0,phase:'',hitDone:false,block:false,stun:0,
          wins:0,sprR,sprL,sprF,flash:0,lunge:0};
}
let F1=mkF('p1',400, 1,'moustafa_faceR','moustafa_faceL','moustafa_front');
let F2=mkF('p2',800,-1,'alisa_faceR','alisa_faceL','alisa_front');
const FS=[F1,F2];

let state='intro', round=1, clock=CFG.roundSecs, shakeT=0, shakeAmt=0;
let hitParts=[], roundOver=0, matchOver=false;
let rec=loadRec();
function loadRec(){ try{ const r=JSON.parse(localStorage.getItem('boi')||'{}');
  return {w1:r.w1|0, w2:r.w2|0, matches:r.matches|0}; }catch(e){ return {w1:0,w2:0,matches:0}; } }
function saveRec(){ try{ localStorage.setItem('boi',JSON.stringify(rec)); }catch(e){} }

/* ---------- ввод ---------- */
const K={l:false,r:false,u:false,p:false,k:false,b:false};
let pQ=false, kQ=false;
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') K.l=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') K.r=true;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){ K.u=true; e.preventDefault(); }
  if(e.code==='KeyJ'||e.code==='KeyZ') pQ=true;
  if(e.code==='KeyK'||e.code==='KeyX') kQ=true;
  if(e.code==='KeyL'||e.code==='ShiftLeft'||e.code==='ArrowDown') K.b=true;
  if(e.code==='KeyM') toggleMute();
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') K.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') K.r=false;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') K.u=false;
  if(e.code==='KeyL'||e.code==='ShiftLeft'||e.code==='ArrowDown') K.b=false;
});
function hold(el,on,off){
  const d=e=>{e.preventDefault();on();}, u=e=>{e.preventDefault();off&&off();};
  el.addEventListener('pointerdown',d); el.addEventListener('pointerup',u);
  el.addEventListener('pointerleave',u); el.addEventListener('pointercancel',u);
}
hold(document.getElementById('bL'),()=>K.l=true,()=>K.l=false);
hold(document.getElementById('bR'),()=>K.r=true,()=>K.r=false);
hold(document.getElementById('bU'),()=>K.u=true,()=>K.u=false);
hold(document.getElementById('bB'),()=>K.b=true,()=>K.b=false);
hold(document.getElementById('bP'),()=>{pQ=true;});

/* ---------- сеть ---------- */
const NET={on:false,db:null,room:null,code:'',me:0,last:0,rate:1/20,seen:{},joined:false};
let REMOTE=null;
function netAvailable(){ return !!(FB && window.firebase); }
function netInit(){
  if(NET.db||!netAvailable()) return !!NET.db;
  try{ firebase.initializeApp(FB); NET.db=firebase.database(); }
  catch(e){ try{ NET.db=firebase.database(); }catch(e2){ return false; } }
  return !!NET.db;
}
function roomCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='';
  for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function netEvent(ev){ if(!NET.on||!NET.room) return; ev.by=NET.me; NET.room.child('ev').push(ev); }
function me(){ return NET.me===0?F1:F2; }
function foe(){ return NET.me===0?F2:F1; }
function netSend(force){
  if(!NET.on||!NET.room) return;
  const now=performance.now();
  if(!force && now-NET.last<NET.rate*1000) return;
  NET.last=now;
  const m=me();
  NET.room.child('p'+NET.me).set({x:Math.round(m.x),y:Math.round(m.y),f:m.face,
    hp:Math.round(m.hp), b:m.block?1:0, a:m.atk||'', ph:m.phase||'', s:+m.stun.toFixed(2)});
}
function netAttach(){
  const r=NET.room;
  r.child('p'+(1-NET.me)).on('value',sn=>{
    const v=sn.val(); if(!v) return;
    REMOTE=REMOTE||{};
    REMOTE.x=v.x; REMOTE.y=v.y; REMOTE.face=v.f; REMOTE.hp=v.hp;
    REMOTE.block=!!v.b; REMOTE.atk=v.a||null; REMOTE.phase=v.ph||''; REMOTE.stun=v.s||0;
  });
  r.child('ev').on('child_added',sn=>{
    const e=sn.val(); if(!e||e.by===NET.me||NET.seen[sn.key]) return;
    NET.seen[sn.key]=1;
    if(e.t==='hit'){ takeHit(me(), e.dmg, e.kb, e.up, e.blocked); }
    else if(e.t==='go'){ startMatch(); }
    else if(e.t==='rematch'){ startMatch(); }
  });
}
async function hostRoom(asP1){
  if(!netInit()) return;
  NET.on=true; NET.me=asP1?0:1; NET.code=roomCode();
  NET.room=NET.db.ref('rooms/F'+NET.code);
  await NET.room.set({ts:Date.now()});
  NET.room.onDisconnect().remove();
  netAttach(); waitScreen(true);
  NET.room.child('p'+(1-NET.me)).on('value',sn=>{
    if(sn.val()&&!NET.joined){ NET.joined=true; netEvent({t:'go'}); startMatch(); }
  });
}
async function joinRoom(code,asP1){
  if(!netInit()) return;
  code=(code||'').toUpperCase().trim();
  const ref=NET.db.ref('rooms/F'+code);
  const sn=await ref.get();
  if(!sn.exists()){ alert('Комната '+code+' не найдена'); return; }
  NET.on=true; NET.me=asP1?0:1; NET.code=code; NET.room=ref;
  netAttach(); waitScreen(false); netSend(true);
}
function netLeave(){
  try{ if(NET.room){ NET.room.child('p'+NET.me).remove(); NET.room.off(); } }catch(e){}
  NET.on=false; NET.room=null; NET.joined=false; REMOTE=null; NET.seen={};
}

/* ---------- бой ---------- */
function startAttack(f,kind){
  if(f.atk||f.stun>0||!f.on) return;        // в воздухе не бьём, оглушённый тоже
  f.atk=kind; f.t=0; f.phase='wind'; f.hitDone=false; f.lunge=0;
  SFX.swing();
}
function hitBox(f){
  const M=MOVES[f.atk]; if(!M) return null;
  const w=M.reach, x = f.face>0 ? f.x+FW-10 : f.x-w+10;
  return {x, y:f.y+M.h, w, h:M.h+26};
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function takeHit(f,dmg,kb,up,blocked){
  f.hp=Math.max(0,f.hp-dmg);
  f.vx += kb*(-f.face);
  if(up) f.vy = -up;
  f.stun = blocked?0.12:0.26;
  f.atk=null; f.phase=''; f.flash=blocked?0.1:0.22;
  shakeT=blocked?0.08:0.2; shakeAmt=blocked?5:13;
  if(blocked) SFX.block(); else (dmg>=12?SFX.heavy():SFX.hit());
  for(let i=0;i<(blocked?6:16);i++) hitParts.push({
    x:f.x+FW/2+(Math.random()-.5)*40, y:f.y+60+(Math.random()-.5)*60,
    vx:(Math.random()-.5)*420+kb*0.5*(-f.face), vy:-Math.random()*300-60,
    r:Math.random()*6, vr:(Math.random()-.5)*14, s:4+Math.random()*6,
    c: blocked?C.ice:C.blood, life:.35+Math.random()*.4});
  updHUD();
  if(f.hp<=0 && !roundOver) endRound(f);
}

function stepF(f,dt,input){
  if(f.flash>0) f.flash-=dt;
  if(f.stun>0){ f.stun-=dt; }
  // атака по фазам
  if(f.atk){
    const M=MOVES[f.atk]; f.t+=dt;
    if(f.phase==='wind'){
      f.lunge = Math.min(1,f.t/M.wind)*0.4;
      if(f.t>=M.wind){ f.phase='active'; f.t=0; }
    } else if(f.phase==='active'){
      f.lunge = 1;
      if(!f.hitDone){
        const other = f===F1?F2:F1;
        const hb=hitBox(f);
        const ob={x:other.x,y:other.y,w:FW,h:FH};
        if(hb && overlap(hb,ob)){
          f.hitDone=true;
          // блок работает, если противник смотрит на бьющего
          const facingMe = (other.x < f.x) ? other.face>0 : other.face<0;
          const blocked = other.block && facingMe;
          const dmg = blocked ? Math.round(M.dmg*0.2) : M.dmg;
          const kb  = blocked ? M.kb*0.35 : M.kb;
          const up  = blocked ? 0 : M.up;
          if(NET.on) netEvent({t:'hit',dmg,kb,up,blocked});
          takeHit(other,dmg,kb,up,blocked);
        }
      }
      if(f.t>=M.active){ f.phase='rec'; f.t=0; }
    } else {
      f.lunge = Math.max(0,1-f.t/M.rec);
      if(f.t>=M.rec){ f.atk=null; f.phase=''; f.lunge=0; }
    }
  }
  const busy = !!f.atk || f.stun>0;
  f.block = input && input.b && f.on && !f.atk && f.stun<=0;

  // движение
  let dir=0;
  if(input && !busy && !f.block){ dir=(input.r?1:0)-(input.l?1:0); }
  const target=dir*SPD*(f.block?0:1);
  f.vx += (target-f.vx)*Math.min(1,(f.on?3200:1600)*dt/SPD);
  if(!dir) f.vx *= f.on?0.80:0.96;
  if(input && input.u && f.on && !busy && !f.block){ f.vy=-JUMPV; f.on=false; SFX.jump(); }

  f.vy=Math.min(1300,f.vy+GRAV*dt);
  f.x+=f.vx*dt; f.y+=f.vy*dt; f.anim=(f.anim||0)+Math.abs(f.vx)*dt*0.02;
  if(f.y+FH>=GND){ f.y=GND-FH; f.vy=0; f.on=true; }
  f.x=Math.max(30,Math.min(VW-FW-30,f.x));

  // всегда лицом к противнику, пока не бьём
  const other=f===F1?F2:F1;
  if(!f.atk) f.face = other.x+FW/2 > f.x+FW/2 ? 1 : -1;
}

function step(dt){
  if(state!=='fight') return;
  if(roundOver>0){ roundOver-=dt; if(roundOver<=0) nextRound(); }
  else {
    clock-=dt;
    if(clock<=0){ clock=0; timeUp(); }
  }
  const m=NET.on?me():F1;
  const inp={l:K.l,r:K.r,u:K.u,b:K.b};
  if(pQ){ startAttack(m,'punch'); pQ=false; }
  if(kQ){ startAttack(m,'kick');  kQ=false; }
  stepF(m,dt,inp);

  if(NET.on){
    const o=foe();
    if(REMOTE){
      o.x += (REMOTE.x-o.x)*Math.min(1,dt*16);
      o.y += (REMOTE.y-o.y)*Math.min(1,dt*16);
      o.face=REMOTE.face; o.block=REMOTE.block;
      o.atk=REMOTE.atk||null; o.phase=REMOTE.phase||'';
      o.lunge = (o.phase==='active')?1:(o.phase==='wind'?.4:0);
      if(typeof REMOTE.hp==='number' && REMOTE.hp<o.hp) o.hp=REMOTE.hp;
      if(o.flash>0) o.flash-=dt;
    }
    netSend(false);
  } else {
    stepF(F2,dt,null);                      // локально второй стоит (тренировка)
  }

  if(shakeT>0) shakeT-=dt;
  let n=0;
  for(let i=0;i<hitParts.length;i++){
    const q=hitParts[i]; q.vy+=1700*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.r+=q.vr*dt; q.life-=dt; if(q.life>0) hitParts[n++]=q;
  }
  hitParts.length=n;
  updClock();
}

function endRound(loser){
  const winner = loser===F1?F2:F1;
  winner.wins++;
  roundOver=2.2;
  SFX.ko();
  shout(winner.wins>=CFG.rounds ? 'ПОБЕДА' : 'НОКАУТ');
  updHUD();
}
function timeUp(){
  if(roundOver>0) return;
  const w = F1.hp===F2.hp ? null : (F1.hp>F2.hp?F1:F2);
  if(w){ w.wins++; } roundOver=2.2; SFX.ko();
  shout(w? 'ВРЕМЯ' : 'НИЧЬЯ'); updHUD();
}
function nextRound(){
  if(F1.wins>=CFG.rounds || F2.wins>=CFG.rounds) return matchEnd();
  round++;
  F1.hp=F2.hp=100; F1.x=400; F2.x=800;
  for(const f of FS){ f.y=GND-FH; f.vx=f.vy=0; f.atk=null; f.stun=0; f.block=false; f.on=true; }
  clock=CFG.roundSecs; hitParts.length=0;
  shout('РАУНД '+round); SFX.round(); updHUD();
}
function matchEnd(){
  state='over'; matchOver=true;
  const w = F1.wins>CFG.rounds-1 ? F1 : F2;
  if(w===F1) rec.w1++; else rec.w2++;
  rec.matches++; saveRec(); SFX.win();
  const mine = NET.on ? (w===me()) : (w===F1);
  setTimeout(()=>openOv(`
    <p class="eyebrow">матч ${rec.matches}</p>
    <h1>${w===F1?CFG.p1:CFG.p2} ${w===F1?'победил':'победила'}</h1>
    <div class="tally">
      <div><b>${F1.wins}</b><span>${CFG.p1}</span></div>
      <div><b>${F2.wins}</b><span>${CFG.p2}</span></div>
    </div>
    <p>Всего: <b>${CFG.p1} ${rec.w1}</b> — <b>${rec.w2} ${CFG.p2}</b> за ${rec.matches} матчей.</p>
    <button class="btn" id="again">Ещё бой</button>`), 1300);
  setTimeout(()=>{ const b=document.getElementById('again');
    if(b) b.onclick=()=>{ if(NET.on) netEvent({t:'rematch'}); startMatch(); }; },1400);
}

/* ---------- отрисовка ---------- */
let _sky=null;
function drawStage(){
  if(IMG.arena && IMG.arena.complete && IMG.arena.naturalWidth){
    const a=IMG.arena, k=Math.max(VW/a.width, VH/a.height);
    const w=a.width*k, h=a.height*k;
    ctx.drawImage(a,(VW-w)/2,(VH-h)/2,w,h);
    ctx.fillStyle='rgba(10,6,20,.22)'; ctx.fillRect(0,GND,VW,VH-GND);   // пол чуть темнее
    return;
  }
  if(!_sky){ _sky=ctx.createLinearGradient(0,0,0,VH);
    _sky.addColorStop(0,'#2A1F3E'); _sky.addColorStop(.52,'#4A3356');
    _sky.addColorStop(1,'#7A4A48'); }
  ctx.fillStyle=_sky; ctx.fillRect(0,0,VW,VH);
  // луна
  ctx.fillStyle='rgba(255,236,190,.9)'; ctx.beginPath();
  ctx.arc(1050,130,52,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(74,51,86,.95)'; ctx.beginPath();
  ctx.arc(1026,116,48,0,6.2832); ctx.fill();
  // колонны на фоне
  for(let i=0;i<7;i++){
    const x=60+i*190;
    part(x,250,58,GND-250,dark(C.stone,.28),10);
    part(x-10,230,78,28,dark(C.stone2,.22),10);
  }
  // пол
  part(-40,GND,VW+80,VH-GND+60,C.stone,16);
  ctx.fillStyle=dark(C.stone,.18);
  for(let i=0;i<13;i++) ctx.fillRect(i*100+10,GND+10,78,6);
}

function poseOf(f){
  if(f.hp<=0) return 'down';
  if(f.atk==='punch') return f.phase==='rec'&&f.t>0.08 ? 'idle' : 'jab';
  if(f.atk==='kick')  return f.phase==='wind'&&f.t<0.06 ? 'idle' : 'kick';
  if(f.stun>0) return 'hurt';
  if(f.block) return 'block';
  if(!f.on) return 'jump';
  if(Math.abs(f.vx)>40) return (Math.floor(f.anim*2)%2) ? 'walk' : 'idle';
  return 'idle';
}
function drawFighter(f){
  const who = f===F1 ? 'moustafa' : 'alisa';
  const pose = poseOf(f);
  const pimg = IMG[who+'_'+pose] || IMG[who+'_idle'];
  const usePose = !!(pimg && pimg.complete && pimg.naturalWidth);
  const img = usePose ? pimg
    : IMG[ f.atk||Math.abs(f.vx)>30 ? (f.face>0?f.sprR:f.sprL) : f.sprF ];
  if(!img) return;
  const H = usePose ? FH+44 : FH+16;
  const w = img.width*(H/img.height);
  const cx = f.x+FW/2 + (usePose?0:f.lunge*26*f.face);
  const by = f.y+FH;
  f._pose = usePose;
  ctx.save();
  // тень
  ctx.fillStyle='rgba(8,6,14,.34)';
  ctx.beginPath(); ctx.ellipse(f.x+FW/2, GND+4, 56, 11,0,0,6.2832); ctx.fill();
  // щит
  if(f.block){
    ctx.strokeStyle='rgba(91,167,214,.85)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.ellipse(cx, by-FH/2, FW*0.78, FH*0.56, 0,0,6.2832); ctx.stroke();
    ctx.fillStyle='rgba(91,167,214,.14)'; ctx.fill();
  }
  ctx.translate(cx, by-H/2);
  if(usePose && f.face<0) ctx.scale(-1,1);          // листы нарисованы вправо
  if(f.flash>0){ ctx.filter='brightness(1.9) saturate(.4)'; }
  ctx.drawImage(img,-w/2,-H/2,w,H);
  ctx.filter='none';
  ctx.restore();
}
function drawLimb(f){
  if(!f.atk || (f.phase!=='active' && f.phase!=='wind')) return;
  const M=MOVES[f.atk], ext=(f.phase==='active'?1:f.lunge/0.4)*M.reach;
  if(ext<6) return;
  const ax = f.face>0 ? f.x+FW-14 : f.x+14-ext;
  if(!f._pose){
    const col = f.atk==='kick'?'#2B2735':C.skin;
    part(ax, f.y+M.h+6, ext, f.atk==='kick'?38:32, col, 9);
  }
  if(f.phase==='active'){                       // вспышка на кончике удара
    const tx = f.face>0 ? ax+ext : ax;
    ctx.fillStyle='rgba(255,236,180,.85)';
    ctx.beginPath(); ctx.ellipse(tx, f.y+M.h+22, 16, 22, 0,0,6.2832); ctx.fill();
  }
}

function draw(){
  ctx.save();
  if(shakeT>0){ const k=shakeAmt*(shakeT/0.2);
    ctx.translate((Math.random()-.5)*k,(Math.random()-.5)*k); }
  drawStage();
  const order = F1.y>F2.y ? [F2,F1] : [F1,F2];
  for(const f of order) drawFighter(f);
  for(const f of order) drawLimb(f);          // удары поверх обоих бойцов
  for(const q of hitParts){
    ctx.save(); ctx.globalAlpha=Math.min(1,q.life*2.2);
    ctx.translate(q.x,q.y); ctx.rotate(q.r);
    ctx.fillStyle=q.c; ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*.7); ctx.restore();
  }
  ctx.restore();
}

/* ---------- HUD ---------- */
function updHUD(){
  const set=(bar,ghost,wrap,hp)=>{
    const k=Math.max(0,hp)/100;
    document.getElementById(bar).style.transform='scaleX('+k+')';
    document.getElementById(ghost).style.transform='scaleX('+k+')';
    const w=document.getElementById(wrap);
    w.classList.toggle('low', hp<=55 && hp>28);
    w.classList.toggle('crit', hp<=28);
  };
  set('hb1','hu1','hw1',F1.hp); set('hb2','hu2','hw2',F2.hp);
  const pips=(el,n)=>{ document.getElementById(el).innerHTML=
    Array.from({length:CFG.rounds},(_,i)=>`<span class="pip ${i<n?'win':''}"></span>`).join(''); };
  pips('pp1',F1.wins); pips('pp2',F2.wins);
  document.getElementById('score').textContent = rec.w1+' — '+rec.w2;
}
function updClock(){ document.getElementById('clock').textContent=Math.ceil(Math.max(0,clock)); }
function shout(txt){
  const el=document.getElementById('shout');
  el.textContent=txt; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
function toggleMute(){ muted=!muted; }

function startMatch(){
  closeOv();
  F1.hp=F2.hp=100; F1.wins=F2.wins=0; round=1; clock=CFG.roundSecs;
  F1.x=400; F2.x=800; matchOver=false; roundOver=0; hitParts.length=0;
  for(const f of FS){ f.y=GND-FH; f.vx=f.vy=0; f.atk=null; f.stun=0;
    f.block=false; f.on=true; f.flash=0; f.lunge=0; }
  F1.face=1; F2.face=-1;
  state='fight'; updHUD(); updClock();
  shout('БОЙ'); SFX.round();
  if(NET.on) netSend(true);
}

/* ---------- цикл ---------- */
function rescale(){
  const w=document.getElementById('wrap').clientWidth;
  document.documentElement.style.setProperty('--s',(w/VW).toFixed(4));
  const dpr=Math.min(2,devicePixelRatio||1);
  cvs.width=VW*dpr; cvs.height=VH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingQuality='high';
  _sky=null; _cc.clear();
}
addEventListener('resize',rescale);
let last=0, acc=0; const FIXED=1/120;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts;
  if(state==='fight'){
    acc+=dt; let g=0;
    while(acc>=FIXED && g++<8){ step(FIXED); acc-=FIXED; }
  } else {
    let n=0;
    for(let i=0;i<hitParts.length;i++){ const q=hitParts[i];
      q.vy+=1700*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.r+=q.vr*dt; q.life-=dt;
      if(q.life>0) hitParts[n++]=q; }
    hitParts.length=n;
    if(shakeT>0) shakeT-=dt;
  }
  draw();
}
function boot(){
  document.getElementById('f1').src=SPRITES.moustafa_portrait;
  document.getElementById('f2').src=SPRITES.alisa_portrait;
  document.getElementById('n1').textContent=CFG.p1;
  document.getElementById('n2').textContent=CFG.p2;
  rescale();
  const names=Object.keys(SPRITES); let left=names.length;
  names.forEach(n=>{ const im=new Image();
    im.onload=im.onerror=()=>{ if(--left===0) ready(); }; im.src=SPRITES[n]; IMG[n]=im; });
  if(!names.length) ready();
}
function ready(){ updHUD(); updClock(); intro(); requestAnimationFrame(loop); }
boot();
</script>
