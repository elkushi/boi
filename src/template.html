<style>

  --disp:'Fredoka','Trebuchet MS',system-ui,sans-serif;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--cream);font-family:var(--ui);

/* ---------- HUD ---------- */

.nm b{font-family:var(--disp);font-weight:600;font-size:calc(18px*var(--s));color:#fff;letter-spacing:.02em}

#shout{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);text-align:center;

#shout.long{animation-duration:3.2s}
@keyframes shout{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1)}

}

.stack{display:flex;flex-direction:column;gap:calc(9px*var(--s));align-items:center}
.row{display:flex;gap:calc(9px*var(--s));justify-content:center;flex-wrap:wrap}

.duo img{width:calc(72px*var(--s));height:calc(72px*var(--s));border-radius:calc(15px*var(--s));
  object-fit:cover;border:calc(4px*var(--s)) solid #fff;box-shadow:0 calc(5px*var(--s)) calc(14px*var(--s)) rgba(0,0,0,.4)}
.duo span{font-family:var(--disp);font-size:calc(26px*var(--s));color:var(--blood);font-weight:700}
.code{font-family:var(--disp);font-weight:700;font-size:calc(52px*var(--s));letter-spacing:.18em;color:#241E33;

input.code-in{font-family:var(--disp);font-weight:700;font-size:calc(30px*var(--s));letter-spacing:.2em;
  text-align:center;text-transform:uppercase;width:calc(210px*var(--s));min-width:150px;

.who{display:flex;gap:calc(8px*var(--s));justify-content:center;margin:calc(4px*var(--s)) 0 calc(10px*var(--s))}

.who button.sel{background:#241E33;color:#fff;border-color:#241E33}
.tally{display:flex;justify-content:center;gap:calc(26px*var(--s));margin:calc(2px*var(--s)) 0 calc(12px*var(--s))}
.tally b{display:block;font-family:var(--disp);font-size:calc(32px*var(--s));color:#241E33;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.tally span{font-size:calc(11px*var(--s));letter-spacing:.14em;text-transform:uppercase;color:#7A6F96;font-weight:600}
.keys{display:flex;gap:calc(10px*var(--s));justify-content:center;flex-wrap:wrap;margin-top:calc(10px*var(--s));
  font-size:calc(12px*var(--s));color:#5A5078}
kbd{font-family:var(--ui);font-weight:700;font-size:calc(11px*var(--s));background:#fff;
  border:calc(2px*var(--s)) solid var(--cream-2);border-bottom-width:calc(4px*var(--s));
  border-radius:calc(6px*var(--s));padding:calc(2px*var(--s)) calc(6px*var(--s));color:#241E33}
.dots{font-size:calc(14px*var(--s));color:#7A6F96;margin:calc(6px*var(--s)) 0}
.help{font-size:calc(13px*var(--s));color:#5A5078;line-height:1.5;margin:calc(8px*var(--s)) auto 0;max-width:calc(480px*var(--s))}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--void);
  color:var(--cream);z-index:60;padding:34px}
#rotate svg{width:72px;height:72px;margin-bottom:18px;animation:tip 2.4s ease-in-out infinite}
#rotate h2{font-family:var(--disp);font-weight:600;font-size:1.6rem;margin:0 0 .5rem;color:#fff}
#rotate p{margin:0;font-size:.96rem;line-height:1.6;color:#A79BC4}
@keyframes tip{0%,55%,100%{transform:rotate(0)}25%,40%{transform:rotate(-90deg)}}
@media (orientation:portrait){ #rotate.armed{display:grid} }
@media (prefers-reduced-motion:reduce){
  #ov,.panel,.btn,.hpwrap i,.hpwrap u{transition:none}
  #shout.go{animation:none;opacity:1}

}
</style>

<script>
/* ============================================================
   БОЙ — файтинг на двоих через интернет, Мустафа против Алисы.
   Каждый телефон считает своего бойца. Попадание решает
   АТАКУЮЩИЙ и присылает событие: свой удар всегда отзывается
   мгновенно и не теряется из-за задержки. Хост запускает хаос
   (утки, пицца, луна) и объявляет конец времени.
   ============================================================ */
const CFG = { p1:'Мустафа', p2:'Алиса', rounds:2, roundSecs:75 };
const SPRITES = /*__SPRITES__*/{};
const META    = /*__META__*/{};
const FB      = /*__FIREBASE__*/null;
const IMG={};

const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
const VW=1280, VH=720, GND=548;

/* ---------- реплики ---------- */
const LINES={
  moustafa:[ 'Я учил русский ради этого удара!', 'Это за то, что не ответила на сообщение!',
    'Прости… шучу, не прости!', 'Ты красивая, но получишь!', 'Мама сказала не бить девочек. Мама не видит.',
    'Ай! Алис, больно же!', 'Сейчас покажу, кто тут главный по пульту!', 'Один удар — и ужин готовишь ты!' ],
  alisa:[ 'Мустафа, иди учи падежи!', 'Это за холодный чай!', 'Я вообще-то тренировалась!',
    'Ой, прости! Нет, не прости.', 'Ты до меня даже не дотянешься!', 'Люблю тебя. Но сейчас — нет.',
    'Кто сильнее? Я!', 'Ещё удар — и посуда твоя на неделю!' ],
};
const KO_LINES={
  moustafa:[ 'Алиса требует реванш!', 'Мустафа теперь главный по пульту', 'Алиса: «ты поддавался? нет? ну ладно»',
    'Мустафа: «это было легко». Алиса так не считает', 'Посуду на этой неделе моет Алиса' ],
  alisa:[ 'Мустафа идёт готовить ужин', 'Алиса, как всегда, права', 'Мустафа: «это была разминка»',
    'Мустафа обещает выучить ещё один падеж', 'Посуду на этой неделе моет Мустафа' ],
};
const DUCK_LINES=['КРЯ!','Утка?!','Это нечестно!','Ай, утка!'];
const POPS={jab:'ХЛОП',straight:'БАМ',heavy:'БУМ!',kick:'ШМЯК',heavykick:'ТРАХ!',uppercut:'ОПА!',
            airkick:'ХРЯСЬ',airpunch:'ТЫЦ',wave:'ВЖУХ!',proj:'БДЫЩ!',duck:'КРЯ!'};

/* ---------- палитра ---------- */
const C={ blood:'#C0202B', gold:'#F2B93B', ice:'#5BA7D6', pink:'#E95FB6', bone:'#E8DFCF' };

/* ---------- звук ---------- */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,type,vol,slide,delay){
  const a=ac(); if(!a||muted) return;
  const t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.05,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
}
function noise(dur,vol,hp){
  const a=ac(); if(!a||muted) return;
  const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const g=a.createGain(); g.gain.value=vol||.08;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

const MUS={on:false,next:0,step:0,timer:null};
function musicStart(){ const a=ac(); if(!a||MUS.on) return; MUS.on=true; MUS.next=a.currentTime+.1; MUS.step=0;
  MUS.timer=setInterval(musicTick,90); }
function musicStop(){ MUS.on=false; if(MUS.timer) clearInterval(MUS.timer); MUS.timer=null; }
function musicTick(){
  const a=AC; if(!a||muted||state!=='fight') return;
  const bpm=138, beat=60/bpm, q=beat/2;
  while(MUS.next<a.currentTime+.25){
    const s=MUS.step%16, t=MUS.next;
    const bass=[55,55,0,55, 65,0,55,0, 49,49,0,49, 73,0,65,0][s];
    if(bass){ const o=a.createOscillator(), g=a.createGain(); o.type='triangle';
      o.frequency.value=bass; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+q*.9);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+q); }
    if(s%4===2){ const n=Math.floor(a.sampleRate*.03), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      const src=a.createBufferSource(); src.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=5000;
      const g=a.createGain(); g.gain.value=.025; src.connect(f); f.connect(g); g.connect(a.destination); src.start(t); }
    MUS.next+=q; MUS.step++;
  }
}

const NET={on:false,db:null,room:null,code:'',me:0,host:false,last:0,rate:1/20,seen:{},joined:false,lastSeen:0};
let REMOTE=null;
function netAvailable(){ return !!(FB && window.firebase); }
function netInit(){
  if(NET.db||!netAvailable()) return !!NET.db;
  try{ firebase.initializeApp(FB); NET.db=firebase.database(); }
  catch(e){ try{ NET.db=firebase.database(); }catch(e2){ return false; } }
  return !!NET.db;

function roomCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='';
  for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function netEvent(ev){ if(!NET.on||!NET.room) return; ev.by=NET.me; ev.ts=Date.now(); NET.room.child('ev').push(ev); }
function me(){ return NET.on ? (NET.me===0?F1:F2) : F1; }
function foe(){ return NET.on ? (NET.me===0?F2:F1) : F2; }
function isHost(){ return !NET.on || NET.host; }
function netSend(force){
  if(!NET.on||!NET.room) return;
  const now=performance.now();
  if(!force && now-NET.last<NET.rate*1000) return;
  NET.last=now;
  const m=me();
  NET.room.child('p'+NET.me).set({x:Math.round(m.x),y:Math.round(m.y),f:m.face,hp:Math.round(m.hp),
    b:m.block?1:0, po:poseOf(m), m:Math.round(m.meter), dn:m.down>0?1:0, t:Date.now()});
}
function netAttach(){
  const r=NET.room;
  r.child('p'+(1-NET.me)).on('value',sn=>{
    const v=sn.val();
    if(!v){ if(NET.joined && state==='fight') opponentLeft(); return; }
    REMOTE=REMOTE||{}; NET.lastSeen=performance.now();
    REMOTE.x=v.x; REMOTE.y=v.y; REMOTE.face=v.f; REMOTE.hp=v.hp; REMOTE.block=!!v.b;
    REMOTE.pose=v.po||'idle'; REMOTE.meter=v.m||0; REMOTE.down=!!v.dn;
  });
  r.child('ev').on('child_added',sn=>{
    const e=sn.val(); if(!e||e.by===NET.me||NET.seen[sn.key]) return;
    NET.seen[sn.key]=1;
    if(e.ts && Date.now()-e.ts>20000) return;                 // старые события комнаты
    switch(e.t){
      case 'hit':   takeHit(me(), e.dmg, e.kb, e.up, e.blocked, e.d, e.kind); if(e.pid) projs=projs.filter(p=>p.id!==e.pid); break;
      case 'proj':  projs.push({id:e.id,x:e.x,y:e.y,vx:e.vx,who:e.who,remote:true,life:3,t:0}); break;
      case 'pgone': projs=projs.filter(p=>p.id!==e.id); break;
      case 'taunt': doTaunt(foe(), e.i, e.ph, true); break;
      case 'emo':   doEmo(foe(), e.e, true); break;
      case 'chaos': applyChaos(e.k, e.x, e.who, e.id); break;
      case 'eat':   eatItem(e.id, foe(), true); break;
      case 'timeup': if(!isHost()) resolveTime(e.w); break;
      case 'heart': heartBurst(foe()); break;
      case 'go': case 'rematch': startMatch(); break;
    }
  });
}
async function hostRoom(asP1){
  if(!netInit()) return;
  NET.on=true; NET.host=true; NET.me=asP1?0:1; NET.code=roomCode();
  NET.room=NET.db.ref('rooms/F'+NET.code);
  await NET.room.set({ts:Date.now(),host:NET.me});
  NET.room.onDisconnect().remove();
  netAttach(); waitScreen(true);
  NET.room.child('p'+(1-NET.me)).on('value',sn=>{
    if(sn.val()&&!NET.joined){ NET.joined=true; netEvent({t:'go'}); startMatch(); }
  });

async function joinRoom(code,asP1){
  if(!netInit()) return;
  code=(code||'').toUpperCase().trim();
  const ref=NET.db.ref('rooms/F'+code);
  let sn; try{ sn=await ref.get(); }catch(e){ toast('Нет связи с сервером'); return; }
  if(!sn.exists()){ toast('Комната '+code+' не найдена'); return; }
  const v=sn.val(); if(typeof v.host==='number') asP1 = v.host!==0;   // занимаем свободного бойца
  NET.on=true; NET.host=false; NET.me=asP1?0:1; NET.code=code; NET.room=ref; NET.joined=true;
  ref.child('p'+NET.me).onDisconnect().remove();
  netAttach(); waitScreen(false); netSend(true);

/* ---------- бой ---------- */
function reachOf(f,M){ return M.reach*(f.big>0?1.4:1); }
function pressBtn(f,btn){
  if(f.stun>0||f.down>0||f.taunt>0) return;
  if(f.atk){                                   // цепочка: следующий удар, если этот попал
    const cur=MOVES[f.atk];
    if(cur.next && cur.btn===btn && f.hitDone && f.phase!=='wind') f.chainQ=cur.next;
    return;
  }
  let kind=null;
  if(btn==='p') kind=f.on?'jab':'airpunch';
  else if(btn==='k') kind=f.on?'kick':'airkick';
  else if(btn==='h') kind=f.on?'uppercut':null;
  else if(btn==='s'){
    if(!f.on) return;
    if(f.meter>=100){ const o=f===F1?F2:F1; kind = Math.abs(o.x-f.x)<230 ? 'wave':'special'; f.meter=0; SFX.super(); }
    else return;
  }
  if(kind) startAttack(f,kind);
}
function startAttack(f,kind){
  f.atk=kind; f.t=0; f.phase='wind'; f.hitDone=false; f.lunge=0; f.chainQ=null; f.charge=false;
  if(!MOVES[kind].super) SFX.swing();
}
function hitBox(f){
  const M=MOVES[f.atk]; if(!M||!M.reach) return null;
  const w=reachOf(f,M), x = f.face>0 ? f.x+FW-14 : f.x-w+14;
  return {x, y:f.y+M.h, w, h:120};
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function takeHit(f,dmg,kb,up,blocked,dir,kind){
  if(f.hp<=0 && roundOver>0) return;
  f.hp=Math.max(0,f.hp-dmg);
  const d = dir||(-f.face);
  f.vx += kb*d;
  if(up){ f.vy = -up; f.on=false; if(up>=300) f.kd=true; }
  f.stun = blocked?0.12:(up>=300?0.6:0.28);
  f.atk=null; f.phase=''; f.chainQ=null; f.taunt=0; f.charge=false;
  f.flash=blocked?0.1:0.22; f.hitstop=blocked?0.03:(dmg>=15?0.09:0.05);
  if(blocked){ f.counter=0.3; f.meter=Math.min(100,f.meter+3); }
  else f.meter=Math.min(100,f.meter+8);
  shakeT=blocked?0.08:0.2; shakeAmt=blocked?5:(dmg>=15?16:11);
  if(blocked) SFX.block(); else (dmg>=12?SFX.heavy():SFX.hit());
  for(let i=0;i<(blocked?6:16);i++) hitParts.push({
    x:f.x+FW/2+(Math.random()-.5)*40, y:f.y+60+(Math.random()-.5)*60,
    vx:(Math.random()-.5)*420+kb*0.5*d, vy:-Math.random()*300-60,
    r:Math.random()*6, vr:(Math.random()-.5)*14, s:4+Math.random()*6,
    c: blocked?C.ice:(f.who==='alisa'?C.pink:C.blood), life:.35+Math.random()*.4});
  pop(f.x+FW/2+(Math.random()-.5)*50, f.y+70, blocked?'БЛОК':(POPS[kind]||'БАМ'), blocked?C.ice:C.gold);
  updHUD();
  if(f.hp<=0 && roundOver<=0) endRound(f);
}
function pop(x,y,txt,col){ pops.push({x,y,txt,col:col||C.gold,t:0,life:.7,ang:(Math.random()-.5)*.5}); }

function spawnProj(f){
  const id=++projId, dir=f.face;
  const p={id,x:f.x+FW/2+dir*70,y:f.y+95,vx:dir*620,who:f.who,remote:false,life:3,t:0};
  projs.push(p); if(NET.on) netEvent({t:'proj',id,x:Math.round(p.x),y:Math.round(p.y),vx:p.vx,who:p.who});
}
function stepProjs(dt){
  const m=me(), o=foe(); let n=0;
  for(const p of projs){
    p.x+=p.vx*dt; p.t+=dt; p.life-=dt;
    for(let i=0;i<2;i++) fx.push({x:p.x+(Math.random()-.5)*30,y:p.y+(Math.random()-.5)*30,vx:-p.vx*.2+(Math.random()-.5)*80,vy:(Math.random()-.5)*120,
      life:.3+Math.random()*.3,s:6+Math.random()*10,c:p.who==='alisa'?C.pink:C.ice});
    let gone = p.x<-80||p.x>VW+80||p.life<=0;
    if(!gone && !p.remote){
      // своя волна бьёт соперника; две волны гасят друг друга
      const ob={x:o.x,y:o.y,w:FW,h:FH};
      if(!(o.down>0) && overlap({x:p.x-34,y:p.y-34,w:68,h:68},ob)){
        const facingMe = (o.x<m.x) ? o.face>0 : o.face<0;
        const blocked = o.block && facingMe;
        const dir = p.vx>0?1:-1;
        const dmg=blocked?4:18, kb=blocked?120:380, up=blocked?0:140;
        if(NET.on) netEvent({t:'hit',dmg,kb,up,blocked,d:dir,kind:'proj',pid:p.id});
        takeHit(o,dmg,kb,up,blocked,dir,'proj'); m.meter=Math.min(100,m.meter+10);
        burst(p.x,p.y,p.who==='alisa'?C.pink:C.ice,24); gone=true;
      }
      const other=projs.find(q=>q!==p&&q.remote&&Math.abs(q.x-p.x)<60&&Math.abs(q.y-p.y)<60);
      if(!gone && other){ burst(p.x,p.y,'#fff',30); other.life=0; gone=true; if(NET.on) netEvent({t:'pgone',id:p.id}); }
    }
    if(!gone) projs[n++]=p;
  }
  projs.length=n;
}
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=120+Math.random()*320;
  fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.4,s:5+Math.random()*9,c}); } }

function doTaunt(f,i,ph,remote){
  if(f.atk||f.stun>0||f.down>0||f.taunt>0) return;
  f.taunt=1.3; f.tauntI=i; f.bubble=LINES[f.who][ph]; f.bubT=2.6; SFX.taunt();
  if(!remote && NET.on) netEvent({t:'taunt',i,ph});
}
function doEmo(f,e,remote){
  const E=['','❤️','😂','😡'][e]||'❤️';
  fx.push({x:f.x+FW/2,y:f.y-20,vx:(Math.random()-.5)*40,vy:-120,life:1.6,s:64,c:'',txt:E,grav:0});
  SFX.emo(); toast((f.who==='alisa'?CFG.p2:CFG.p1)+': '+E);

/* ---------- хаос ---------- */
const CHAOS=[{k:'duck',name:'УТКА!',e:'🦆'},{k:'pizza',name:'ПИЦЦА!',e:'🍕'},{k:'moon',name:'ЛУНА',e:'🌙'},
             {k:'giant',name:'ГИГАНТ',e:'🍄'},{k:'fast',name:'ТУРБО',e:'⚡'},{k:'duck',name:'УТКИ!',e:'🦆🦆'}];
function scheduleChaos(){ chaosT=11+Math.random()*9; }
function spawnChaos(){
  const c=rnd(CHAOS); let x=160+Math.random()*(VW-320), who=0;
  if(c.k==='giant') who = F1.hp<=F2.hp?0:1;
  if(c.k==='duck'||c.k==='pizza'){ const t=rnd(FS); x=Math.max(80,Math.min(VW-80,t.x+FW/2+(Math.random()-.5)*160)); }
  const id=++itemId;
  if(NET.on) netEvent({t:'chaos',k:c.k,x:Math.round(x),who,id});
  applyChaos(c.k,x,who,id);
}
function applyChaos(k,x,who,id){
  const c=CHAOS.find(c=>c.k===k)||CHAOS[0];
  shout(c.e+' '+c.name,'',true);
  if(k==='duck'){ items.push({k,id,x,y:-160,vy:0,vx:0,t:0,bounces:0,hitMe:false,alive:true}); SFX.quack(); }
  else if(k==='pizza'){ items.push({k,id,x,y:-120,vy:0,vx:0,t:0,bounces:0,alive:true,sit:0}); SFX.boing(); }
  else if(k==='moon'){ mods.moon=9; SFX.boing(); }

  else if(k==='giant'){ FS[who].big=9; SFX.boing(); }

function stepItems(dt){
  const m=me(); let n=0;
  const g = mods.moon>0 ? 700 : 1900;
  for(const it of items){
    it.t+=dt;
    if(it.sit>0){ it.sit-=dt; if(it.sit<=0) it.alive=false; }
    else { it.vy+=g*dt; it.y+=it.vy*dt; it.x+=it.vx*dt;
      if(it.y>=GND-70){ it.y=GND-70;
        if(it.k==='duck'){ it.bounces++; if(it.bounces===1){ it.vy=-520; SFX.quack(); } else if(it.bounces===2){ it.vy=-260; it.vx=(it.x<VW/2?-1:1)*260; } else { it.vy=0; } }
        else { it.vy=0; it.sit=7; SFX.yum(); }
      }
      if(it.vy>0 && it.k==='duck' && !it.hitMe && m.hp>0 && m.down<=0 &&
         overlap({x:it.x-45,y:it.y-10,w:90,h:90},{x:m.x,y:m.y,w:FW,h:FH})){
        it.hitMe=true; const d=(m.x+FW/2<it.x)?-1:1;
        takeHit(m,10,320,380,false,d,'duck'); m.bubble=rnd(DUCK_LINES); m.bubT=1.8; SFX.quack();
      }
      if(it.k==='pizza' && it.vy===0 && m.hp>0 && overlap({x:it.x-40,y:it.y-20,w:80,h:100},{x:m.x,y:m.y,w:FW,h:FH})) eatItem(it.id,m,false);
      if(it.x<-120||it.x>VW+120) it.alive=false;
    }
    if(it.alive) items[n++]=it;
  }
  items.length=n;
}
function eatItem(id,f,remote){
  const it=items.find(i=>i.id===id); if(!it) return;
  it.alive=false; items=items.filter(i=>i!==it);
  f.hp=Math.min(100,f.hp+15); f.bubble=rnd(['Ням!','Вкусно!','Моя пицца!','Спасибо, повар!']); f.bubT=1.6;

/* ---------- бот для тренировки ---------- */
const BOT={t:0,act:null,blockT:0,dir:0};
function botInput(f,o,dt){
  const inp={l:false,r:false,u:false,b:false,s:false};
  if(f.hp<=0||state!=='fight') return inp;
  const d=o.x-f.x, ad=Math.abs(d);
  BOT.t-=dt; if(BOT.blockT>0){ BOT.blockT-=dt; inp.b=true; return inp; }
  if(o.atk && o.phase==='wind' && ad<220 && Math.random()<0.02){ BOT.blockT=0.45; }
  if(BOT.t<=0){
    BOT.t=0.22+Math.random()*0.25;
    const r=Math.random();
    if(ad>175){ BOT.dir = r<0.85 ? Math.sign(d) : -Math.sign(d); if(r>0.95) inp.u=true; }
    else {
      BOT.dir = r<0.15 ? -Math.sign(d) : 0;
      if(r<0.5){ pressBtn(f, rnd(['p','p','k','h'])); }
      else if(r<0.58 && f.meter>=100) pressBtn(f,'s');
      else if(r<0.66) BOT.blockT=0.5;
      else if(r<0.70) doTaunt(f,1+Math.floor(Math.random()*3),Math.floor(Math.random()*LINES[f.who].length),true);
      else if(r<0.78) inp.u=true;
    }
    if(ad>300 && f.meter<100 && Math.random()<0.3) BOT.chargeT=0.8;
  }
  if(BOT.chargeT>0){ BOT.chargeT-=dt; inp.s=true; }
  if(BOT.dir>0) inp.r=true; if(BOT.dir<0) inp.l=true;
  return inp;
}

/* ---------- шаг бойца ---------- */
function stepF(f,dt,input){
  if(f.flash>0) f.flash-=dt;
  if(f.counter>0) f.counter-=dt;
  if(f.powerT>0) f.powerT-=dt;
  if(f.big>0) f.big-=dt;
  if(f.land>0) f.land-=dt;
  if(f.bubT>0){ f.bubT-=dt; if(f.bubT<=0) f.bubble=null; }
  if(f.hitstop>0){ f.hitstop-=dt; return; }
  if(f.stun>0) f.stun-=dt;
  if(f.down>0){ f.down-=dt; }
  if(f.taunt>0){ f.taunt-=dt; if(f.taunt<=0){ f.meter=Math.min(100,f.meter+25); if(f.meter>=100) f.powerT=0.5; } }
  f.sq += (1-f.sq)*Math.min(1,dt*14);
  const grav = mods.moon>0 ? GRAV*0.32 : GRAV;
  const jumpv = mods.moon>0 ? JUMPV*0.85 : JUMPV;
  const spd = SPD*(mods.fast>0?1.6:1);

  // атака по фазам
  if(f.atk){
    const M=MOVES[f.atk]; f.t+=dt;
    if(f.phase==='wind'){
      f.lunge = Math.min(1,f.t/M.wind)*0.4;
      if(f.t>=M.wind){ f.phase='active'; f.t=0; if(M.proj) spawnProj(f); if(!M.air) f.vx += f.face*(M.super?90:150); }
    } else if(f.phase==='active'){
      f.lunge = 1;
      if(!f.hitDone && M.reach){
        const other = f===F1?F2:F1;
        const hb=hitBox(f), ob={x:other.x,y:other.y,w:FW,h:FH};
        if(hb && other.hp>0 && !(other.down>0) && overlap(hb,ob)){
          f.hitDone=true;
          const facingMe = (other.x < f.x) ? other.face>0 : other.face<0;
          const blocked = other.block && facingMe && !M.super;
          const giant = f.big>0?1.3:1;
          const dmg = Math.round((blocked ? M.dmg*0.2 : M.dmg)*giant);
          const kb  = blocked ? M.kb*0.35 : M.kb;
          const up  = blocked ? 0 : M.up;
          if(NET.on && other===foe()) netEvent({t:'hit',dmg,kb,up,blocked,d:f.face,kind:f.atk});
          takeHit(other,dmg,kb,up,blocked,f.face,f.atk);
          f.meter=Math.min(100,f.meter+(blocked?4:12)); if(f.meter>=100 && !M.super) f.powerT=0.4;
          f.hitstop = blocked?0.02:(dmg>=15?0.08:0.045);
        }
      }
      if(f.t>=M.active){ f.phase='rec'; f.t=0; if(f.chainQ){ startAttack(f,f.chainQ); } }
    } else {
      f.lunge = Math.max(0,1-f.t/M.rec);
      if(f.t>=M.rec){ f.atk=null; f.phase=''; f.lunge=0; }
    }
  }
  const busy = !!f.atk || f.stun>0 || f.taunt>0 || f.down>0;
  f.block = !!(input && input.b && f.on && !busy);
  f.charge = !!(input && input.s && f.on && !busy && !f.block && f.meter<100);
  if(f.charge){ f.meter=Math.min(100,f.meter+30*dt); if(f.meter>=100){ f.powerT=0.6; SFX.full(); }
    if(Math.random()<dt*20) fx.push({x:f.x+FW/2+(Math.random()-.5)*90,y:f.y+FH-10,vx:0,vy:-200-Math.random()*200,life:.5,s:5+Math.random()*8,c:f.who==='alisa'?C.pink:C.ice,grav:0}); }

  // движение
  let dir=0;
  if(input && !busy && !f.block && !f.charge){ dir=(input.r?1:0)-(input.l?1:0); }
  const target=dir*spd;
  f.vx += (target-f.vx)*Math.min(1,(f.on?3200:1400)*dt/SPD);
  if(!dir) f.vx *= f.on?0.80:0.97;
  if(input && input.u && f.on && !busy && !f.block && !f.charge){ f.vy=-jumpv; f.on=false; f.sq=1.18; SFX.jump(); }

  f.vy=Math.min(1400,f.vy+grav*dt);
  f.x+=f.vx*dt; f.y+=f.vy*dt; f.anim=(f.anim||0)+Math.abs(f.vx)*dt*0.02; f.idleT=(f.idleT||0)+dt;
  if(!f.on) f.airT+=dt; else f.airT=0;
  if(f.y+FH>=GND){
    if(!f.on){ f.land=0.14; f.sq=0.84; if(f.atk && MOVES[f.atk].air){ f.atk=null; f.phase=''; }
      if(f.kd){ f.kd=false; f.down=0.9; f.stun=0; f.vx*=0.3; shakeT=0.15; shakeAmt=8; SFX.heavy(); } }
    f.y=GND-FH; f.vy=0; f.on=true;
  }
  f.x=Math.max(20,Math.min(VW-FW-20,f.x));

  // всегда лицом к противнику, пока не бьём
  const other=f===F1?F2:F1;
  if(!f.atk && f.stun<=0 && f.down<=0) f.face = other.x+FW/2 > f.x+FW/2 ? 1 : -1;
}

function step(dt){
  if(state!=='fight') return;
  if(roundOver>0){ roundOver-=dt; if(roundOver<=0){ roundOver=0; nextRound(); } }
  else {
    clock-=dt;
    if(clock<=0){ clock=0;
      if(isHost()) timeUp(); else { timeWait+=dt; if(timeWait>2.5) timeUp(); } }
    if(isHost()){ chaosT-=dt; if(chaosT<=0){ spawnChaos(); scheduleChaos(); } }
  }
  if(mods.moon>0) mods.moon-=dt; if(mods.fast>0) mods.fast-=dt; roundAge+=dt;

  const m=me();
  const inp={l:K.l,r:K.r,u:K.u,b:K.b,s:K.s};
  if(roundOver<=0){
    if(pQ) pressBtn(m,'p'); if(kQ) pressBtn(m,'k'); if(hQ) pressBtn(m,'h'); if(sQ) pressBtn(m,'s');
    if(tQ) doTaunt(m,1+Math.floor(Math.random()*3),Math.floor(Math.random()*LINES[m.who].length),false);
    if(eQ) doEmo(m,eQ,false);
  }
  pQ=kQ=hQ=sQ=tQ=false; eQ=0;
  stepF(m,dt,roundOver<=0?inp:null);

  if(NET.on){
    const o=foe();
    if(REMOTE){
      o.x += (REMOTE.x-o.x)*Math.min(1,dt*18);
      o.y += (REMOTE.y-o.y)*Math.min(1,dt*18);
      if(Math.abs(REMOTE.x-o.x)>260) o.x=REMOTE.x;
      o.face=REMOTE.face; o.block=REMOTE.block; o.rpose=REMOTE.pose; o.meter=REMOTE.meter;
      o.down = REMOTE.down?1:0; o.on = o.y+FH>=GND-2;
      if(typeof REMOTE.hp==='number' && REMOTE.hp<o.hp && roundAge>1){ o.hp=REMOTE.hp; updHUD(); if(o.hp<=0 && roundOver<=0) endRound(o); }
      if(typeof REMOTE.hp==='number' && REMOTE.hp>o.hp && roundOver<=0 && roundAge>1){ o.hp=REMOTE.hp; updHUD(); }
      if(o.flash>0) o.flash-=dt; if(o.big>0) o.big-=dt; if(o.bubT>0){ o.bubT-=dt; if(o.bubT<=0) o.bubble=null; }
      if(o.taunt>0) o.taunt-=dt;
    }
    netSend(false);
  } else {
    stepF(F2,dt,roundOver<=0?botInput(F2,F1,dt):null);
  }
  stepProjs(dt); stepItems(dt);
  if(shakeT>0) shakeT-=dt;
  stepFx(dt); updClock();
}
function stepFx(dt){
  let n=0;
  for(let i=0;i<hitParts.length;i++){ const q=hitParts[i]; q.vy+=1700*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.r+=q.vr*dt; q.life-=dt; if(q.life>0) hitParts[n++]=q; }
  hitParts.length=n; n=0;
  for(let i=0;i<fx.length;i++){ const q=fx[i]; q.vy+=(q.grav===0?0:900)*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; if(q.life>0) fx[n++]=q; }
  fx.length=n; n=0;
  for(let i=0;i<pops.length;i++){ const q=pops[i]; q.t+=dt; if(q.t<q.life) pops[n++]=q; }
  pops.length=n;
}

function endRound(loser){

function timeUp(){

function resolveTime(w){

}
function resetFighters(){
  F1.x=380; F2.x=820;
  for(const f of FS){ f.y=GND-FH; f.vx=f.vy=0; f.atk=null; f.phase=''; f.stun=0; f.block=false; f.on=true;
    f.flash=0; f.lunge=0; f.taunt=0; f.charge=false; f.down=0; f.kd=false; f.bubble=null; f.big=0; f.chainQ=null; f.hitstop=0; f.rpose=null; }

function plural(n){ const a=n%10,b=n%100; if(b>=11&&b<=14) return 'матчей'; if(a===1) return 'матч'; if(a>=2&&a<=4) return 'матча'; return 'матчей'; }

/* ---------- отрисовка ---------- */
let _sky=null;
function drawStage(){
  if(IMG.arena && IMG.arena.width){
    if(cvs.width<2) return;
    if(!arenaCvs){                       // арена один раз в буфер нужного размера, дальше просто копия
      arenaCvs=document.createElement('canvas'); arenaCvs.width=cvs.width; arenaCvs.height=cvs.height;
      const c=arenaCvs.getContext('2d'); c.setTransform(SCALE,0,0,SCALE,0,0);
      const a=IMG.arena, k=Math.max(VW/a.width, VH/a.height), w=a.width*k, h=a.height*k;
      c.drawImage(a,(VW-w)/2,(VH-h)/2,w,h);
    }
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(arenaCvs,0,0); ctx.restore();
    if(mods.moon>0){ ctx.fillStyle='rgba(60,70,160,.28)'; ctx.fillRect(0,0,VW,VH); }

  }

  ctx.fillStyle=_sky; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#3A3350'; ctx.fillRect(0,GND,VW,VH-GND);
}

function poseOf(f){
  if(f.hp<=0 || f.down>0) return f.down>0 && f.down<0.3 ? 'getup' : 'down';
  if(f.atk){ const M=MOVES[f.atk];
    if(f.phase==='wind') return M.super?'charge':(M.air?M.pose:(f.t<M.wind*0.5?'guard':M.pose));
    return M.pose; }
  if(f.taunt>0) return 'taunt'+f.tauntI;
  if(f.stun>0) return !f.on ? 'fall' : (Math.floor(f.stun*12)%2 ? 'hurt' : 'hurt2');
  if(f.counter>0) return 'counter';
  if(f.block) return 'block';
  if(f.charge) return 'charge';
  if(f.powerT>0) return 'power';
  if(!f.on) return f.vy<0 ? (f.airT<0.18?'jump':'jump2') : 'fall';
  if(f.land>0) return 'land';
  if(Math.abs(f.vx)>60) return (Math.floor(f.anim*1.4)%2) ? 'run1' : 'run2';
  return (Math.floor(f.idleT*1.6)%2) ? 'idle2' : 'idle';
}
function drawFighter(f){
  const pose = (NET.on && f===foe() && f.rpose) ? f.rpose : poseOf(f);
  let key=f.who+'_'+pose, img=IMG[key], mt=META[key];
  if(!img||!img.width){ key=f.who+'_idle'; img=IMG[key]; mt=META[key]; }
  if(!img) return;
  const big = f.big>0 ? 1+0.4*Math.min(1,f.big*3)*Math.min(1,(9-f.big)*3) : 1;
  const w=img.width*big, h=img.height*big, ax=(mt&&mt.ax)||0.5;
  const cx = f.x+FW/2, by = f.y+FH;
  ctx.save();
  ctx.fillStyle='rgba(8,6,14,.36)';
  ctx.beginPath(); ctx.ellipse(cx, GND+4, 54*big, 10*big,0,0,6.2832); ctx.fill();
  if(f.block){
    ctx.strokeStyle='rgba(91,167,214,.85)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.ellipse(cx+f.face*10, by-FH/2, FW*0.8, FH*0.56, 0,0,6.2832); ctx.stroke();
    ctx.fillStyle='rgba(91,167,214,.14)'; ctx.fill();
  }
  if(f.big>0){ ctx.strokeStyle='rgba(242,185,59,.5)'; ctx.lineWidth=4; ctx.setLineDash([12,10]);
    ctx.beginPath(); ctx.ellipse(cx, GND+4, 70*big, 14*big,0,0,6.2832); ctx.stroke(); ctx.setLineDash([]); }
  ctx.translate(cx, by);
  ctx.scale(f.face<0?-1:1, 1);
  ctx.scale(1/f.sq, f.sq);
  ctx.drawImage(img, -w*ax, -h, w, h);
  if(f.flash>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.75;   // вспышка без ctx.filter (он роняет GPU на Android)
    ctx.drawImage(img, -w*ax, -h, w, h); ctx.drawImage(img, -w*ax, -h, w, h); }
  ctx.restore();
  if(f.bubble) drawBubble(f, big);
}
function wrapText(t,max){ const words=t.split(' '), lines=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>max){ lines.push(cur.trim()); cur=w; } else cur+=' '+w; }
  if(cur.trim()) lines.push(cur.trim()); return lines; }
function drawBubble(f,big){
  const lines=wrapText(f.bubble,20);
  ctx.save(); ctx.font='600 22px '+FONT_UI;
  const lw=Math.max(...lines.map(l=>ctx.measureText(l).width));
  const w=lw+32, h=lines.length*28+18, cx=f.x+FW/2, top=f.y-h-26*big-10;
  const x=Math.max(8,Math.min(VW-w-8,cx-w/2)), y=Math.max(8,top);
  const a=Math.min(1,f.bubT*3);
  ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.strokeStyle='#241E33'; ctx.lineWidth=3;
  rr(x,y,w,h,14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-10,y+h-1); ctx.lineTo(cx+10,y+h-1); ctx.lineTo(cx,y+h+14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.fillRect(cx-9,y+h-3,18,5);
  ctx.fillStyle='#241E33'; ctx.textAlign='center'; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,x+w/2,y+10+i*28));
  ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawLimbFx(f){
  if(!f.atk || f.phase!=='active') return;
  const M=MOVES[f.atk]; if(!M.reach) return;
  const ext=reachOf(f,M), ax = f.face>0 ? f.x+FW-14 : f.x+14-ext;
  const tx = f.face>0 ? ax+ext-10 : ax+10;
  ctx.fillStyle='rgba(255,236,180,.8)';
  ctx.beginPath(); ctx.ellipse(tx, f.y+M.h+50, 14, 20, 0,0,6.2832); ctx.fill();
}
const _grad={};
function drawProj(p){
  const col=p.who==='alisa'?C.pink:C.ice, r=(30+Math.sin(p.t*30)*4)*1.8;
  let g=_grad[col]; if(!g){ g=ctx.createRadialGradient(0,0,4,0,0,60);
    g.addColorStop(0,'#fff'); g.addColorStop(.35,col); g.addColorStop(1,'rgba(0,0,0,0)'); _grad[col]=g; }
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(p.x,p.y); ctx.scale(r/60,r/60);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,60,0,6.2832); ctx.fill();
  ctx.restore();
}
/* эмодзи рисуем один раз в маленький канвас: fillText с эмодзи на Android медленный */
const _emo={};
function emoji(t,size){
  const k=t+size; let c=_emo[k];
  if(!c){ c=document.createElement('canvas'); c.width=c.height=Math.ceil(size*1.3);
    const x=c.getContext('2d'); x.font=size+'px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign='center'; x.textBaseline='middle'; x.fillText(t,c.width/2,c.height/2+size*0.05); _emo[k]=c; }
  return c;
}
let FONT_DISP='', FONT_UI='';
function drawItem(it){
  ctx.save();
  ctx.fillStyle='rgba(8,6,14,.3)'; ctx.beginPath(); ctx.ellipse(it.x, GND+4, 44, 9,0,0,6.2832); ctx.fill();
  const wob = it.k==='duck' ? Math.sin(it.t*18)*0.15 : (it.sit>0?Math.sin(it.t*6)*0.08:0.2);
  ctx.translate(it.x, it.y+35); ctx.rotate(wob); if(it.vx<0) ctx.scale(-1,1);
  const c=emoji(it.k==='duck'?'🦆':'🍕',110); ctx.drawImage(c,-c.width/2,-c.height/2);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shakeT>0){ const k=shakeAmt*(shakeT/0.2); ctx.translate((Math.random()-.5)*k,(Math.random()-.5)*k); }
  drawStage();
  const order = F1.y>F2.y ? [F2,F1] : [F1,F2];
  for(const it of items) if(it.y<GND-200) drawItem(it);
  for(const f of order) drawFighter(f);
  for(const f of order) drawLimbFx(f);
  for(const it of items) if(it.y>=GND-200) drawItem(it);
  for(const p of projs) drawProj(p);
  for(const q of hitParts){
    ctx.save(); ctx.globalAlpha=Math.min(1,q.life*2.2); ctx.translate(q.x,q.y); ctx.rotate(q.r);
    ctx.fillStyle=q.c; ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*.7); ctx.restore();
  }
  for(const q of fx){
    ctx.save(); ctx.globalAlpha=Math.min(1,q.life*1.5);
    if(q.txt){ const c=emoji(q.txt,Math.round(q.s/8)*8); ctx.drawImage(c,q.x-c.width/2,q.y-c.height/2); }
    else { ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.s*Math.min(1,q.life*2)/2,0,6.2832); ctx.fill(); }
    ctx.restore();
  }
  for(const q of pops){
    const k=q.t/q.life, sc=k<0.15? 0.4+k/0.15*0.8 : 1.2-(k-0.15)*0.25;
    ctx.save(); ctx.globalAlpha=k>0.7?(1-k)/0.3:1; ctx.translate(q.x,q.y-k*50); ctx.rotate(q.ang); ctx.scale(sc,sc);
    ctx.font='700 46px '+FONT_DISP;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=8; ctx.strokeStyle='#241E33'; ctx.lineJoin='round'; ctx.strokeText(q.txt,0,0);
    ctx.fillStyle=q.col; ctx.fillText(q.txt,0,0); ctx.restore();
  }
  ctx.restore();
}

/* ---------- HUD ---------- */
function updHUD(){
  const set=(bar,ghost,wrap,hp)=>{
    const k=Math.max(0,hp)/100;
    $(bar).style.transform='scaleX('+k+')'; $(ghost).style.transform='scaleX('+k+')';
    const w=$(wrap); w.classList.toggle('low', hp<=55 && hp>28); w.classList.toggle('crit', hp<=28);
  };
  set('hb1','hu1','hw1',F1.hp); set('hb2','hu2','hw2',F2.hp);
  const pips=(el,n)=>{ $(el).innerHTML=Array.from({length:CFG.rounds},(_,i)=>`<span class="pip ${i<n?'win':''}"></span>`).join(''); };
  pips('pp1',F1.wins); pips('pp2',F2.wins);
  $('score').textContent = rec.w1+' — '+rec.w2;
}
let _m1=-1,_m2=-1,_mr=null;
function updMeter(){
  const a=Math.round(F1.meter), b=Math.round(F2.meter);
  if(a!==_m1){ _m1=a; $('mb1').style.transform='scaleX('+(a/100)+')'; $('mw1').classList.toggle('full',a>=100); }
  if(b!==_m2){ _m2=b; $('mb2').style.transform='scaleX('+(b/100)+')'; $('mw2').classList.toggle('full',b>=100); }
  const r=me().meter>=100; if(r!==_mr){ _mr=r; $('bS').classList.toggle('ready',r); }
}
let _clk=-1;
function updClock(){ const c=Math.ceil(Math.max(0,clock)); if(c!==_clk){ _clk=c; $('clock').textContent=c; } updMeter(); }
function shout(txt,sub,long){
  const el=$('shout');
  el.innerHTML=txt+(sub?'<small>'+sub+'</small>':''); el.classList.remove('go','long'); void el.offsetWidth;
  el.classList.add('go'); if(long) el.classList.add('long');
}
let toastT=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1800); }
function toggleMute(){ muted=!muted; toast(muted?'Звук выключен':'Звук включён'); }

/* ---------- экраны ---------- */
const ov=$('ov'), panel=$('panel');
function openOv(h){ panel.innerHTML=h; ov.classList.add('on'); }
function closeOv(){ ov.classList.remove('on'); }
let pickP1=true;
function intro(){
  state='intro'; netLeave(); musicStop();
  openOv(`<div class="duo"><img src="${SPRITES.moustafa_portrait}" alt="">
      <span>VS</span><img src="${SPRITES.alisa_portrait}" alt=""></div>
    <h1>Бой</h1>
    <p>Три раунда, две победы. Удары складываются в серии, щит режет урон, супер копится от ударов и дразнилок. Берегись уток.</p>
    <div class="stack">
      <button class="btn" id="goNet">Играть вдвоём онлайн</button>
      <button class="btn ghost" id="goSolo">Тренировка с ботом</button>
    </div>
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> ходить</span><span><kbd>↑</kbd> прыжок</span>
      <span><kbd>J</kbd> удар</span><span><kbd>K</kbd> нога</span><span><kbd>U</kbd> апперкот</span>
      <span><kbd>L</kbd> щит</span><span><kbd>I</kbd> супер / копить</span><span><kbd>T</kbd> дразнить</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> ❤️😂😡</span>
    </div>`);
  $('goNet').onclick=()=>{ ac(); goFull(); netMenu(); };
  $('goSolo').onclick=()=>{ ac(); goFull(); startMatch(); };
}
function whoRow(){ return `<div class="who">
  <button id="wA" class="${pickP1?'sel':''}">Я — ${CFG.p1}</button>
  <button id="wB" class="${pickP1?'':'sel'}">Я — ${CFG.p2}</button></div>`; }
function bindWho(){
  const a=$('wA'), b=$('wB'); if(!a) return;
  a.onclick=()=>{pickP1=true;a.classList.add('sel');b.classList.remove('sel');};
  b.onclick=()=>{pickP1=false;b.classList.add('sel');a.classList.remove('sel');};
}
function netMenu(){
  if(!netAvailable()){
    openOv(`<p class="eyebrow">нет связи</p><h1>Онлайн недоступен</h1>
      <p>Онлайн работает на опубликованной версии, где подключён Firebase.</p>
      <button class="btn" id="bk">Назад</button>`);
    $('bk').onclick=intro; return;
  }
  openOv(`<p class="eyebrow">онлайн</p><h1>Кто за кого</h1>
    <p>Один создаёт комнату и отправляет ссылку, второй открывает её. Бой начнётся сам.</p>
    ${whoRow()}
    <div class="stack">
      <button class="btn" id="mk">Создать комнату</button>
      <div class="row"><input class="code-in" id="cin" maxlength="4" placeholder="КОД" autocapitalize="characters" autocomplete="off">
      <button class="btn ghost" id="jn">Войти по коду</button></div>
      <button class="btn ghost" id="bk">Назад</button>
    </div>`);
  bindWho();
  $('mk').onclick=()=>hostRoom(pickP1);
  $('jn').onclick=()=>joinRoom($('cin').value,!pickP1);
  $('bk').onclick=intro;
}
function waitScreen(isHost){
  state='intro';
  openOv(`<p class="eyebrow">комната</p>
    ${isHost?`<div class="code">${NET.code}</div><p>Отправь ссылку или продиктуй код.<br>Бой начнётся сам, как только второй зайдёт.</p>
      <button class="btn" id="sh">Отправить ссылку</button>`
            :`<h1>Подключаемся…</h1><p>Комната ${NET.code}.</p>`}
    <div class="dots">ждём второго бойца…</div>
    <button class="btn ghost" id="bk">Отмена</button>`);
  const s=$('sh'); if(s) s.onclick=shareLink;
  $('bk').onclick=()=>{ netLeave(); intro(); };
}
function inviteScreen(code){
  openOv(`<div class="duo"><img src="${SPRITES.moustafa_portrait}" alt=""><span>VS</span><img src="${SPRITES.alisa_portrait}" alt=""></div>
    <p class="eyebrow">тебя зовут на бой</p><h1>Комната ${code}</h1>
    <p>Поверни телефон горизонтально и жми. Бой начнётся сразу.</p>
    <button class="btn" id="go">Войти в бой</button>
    <button class="btn ghost" id="bk" style="margin-top:10px">В меню</button>`);
  $('go').onclick=()=>{ ac(); goFull(); joinRoom(code,true); };
  $('bk').onclick=intro;
}
function startMatch(){
  closeOv();
  F1.hp=F2.hp=100; F1.wins=F2.wins=0; F1.meter=F2.meter=0; round=1; clock=CFG.roundSecs;
  matchOver=false; roundOver=0; resetFighters(); pops.length=0; fx.length=0; scheduleChaos(); roundAge=0;
  BOT.t=0; BOT.blockT=0; BOT.chargeT=0;
  state='fight'; updHUD(); updClock();
  shout('БОЙ!','',false); SFX.round(); musicStart();
  if(NET.on) netSend(true);
}

/* ---------- цикл ---------- */
let SCALE=1, arenaCvs=null;
function rescale(){
  // реальная видимая область (innerHeight на телефоне без адресной строки, в отличие от 100vh)
  const vw=innerWidth, vh=innerHeight; if(vw<10||vh<10) return;
  let w=Math.min(vw, vh*16/9), h=w*9/16;
  document.documentElement.style.setProperty('--ww', w.toFixed(1)+'px');
  document.documentElement.style.setProperty('--wh', h.toFixed(1)+'px');
  document.documentElement.style.setProperty('--s',(w/VW).toFixed(4));
  // буфер канваса = реальный размер на экране (не 2560x1440 на каждом телефоне)
  const dpr=Math.min(TOUCH?1.5:2, devicePixelRatio||1);
  const bw=Math.min(1920, Math.round(w*dpr));
  SCALE=bw/VW; cvs.width=bw; cvs.height=Math.round(VH*SCALE);
  ctx.setTransform(SCALE,0,0,SCALE,0,0); ctx.imageSmoothingQuality='medium';
  _sky=null; arenaCvs=null;
}
addEventListener('resize',rescale);
addEventListener('orientationchange',()=>setTimeout(rescale,250));
if(window.visualViewport) visualViewport.addEventListener('resize',rescale);
let last=0, acc=0; const FIXED=1/120;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(state==='fight'){
    acc+=dt; let g=0;
    while(acc>=FIXED && g++<6){ step(FIXED); acc-=FIXED; }
    if(acc>FIXED*4) acc=0;
  } else { stepFx(dt); if(shakeT>0) shakeT-=dt; for(const f of FS){ if(f.bubT>0){ f.bubT-=dt; if(f.bubT<=0) f.bubble=null; } } }
  draw();
}
function boot(){
  $('f1').src=SPRITES.moustafa_portrait; $('f2').src=SPRITES.alisa_portrait;
  $('n1').textContent=CFG.p1; $('n2').textContent=CFG.p2;
  rescale();
  const names=Object.keys(SPRITES); let left=names.length;
  names.forEach(n=>{ const im=new Image();
    im.onload=()=>{ IMG[n]=im;
      if(window.createImageBitmap && n!=='arena') createImageBitmap(im).then(b=>{ IMG[n]=b; }).catch(()=>{});
      if(--left===0) ready(); };
    im.onerror=()=>{ if(--left===0) ready(); }; im.src=SPRITES[n]; });
  if(!names.length) ready();
}
function ready(){
  FONT_DISP=getComputedStyle(document.documentElement).getPropertyValue('--disp'); FONT_UI=getComputedStyle(document.documentElement).getPropertyValue('--ui');
  updHUD(); updClock();
  const q=new URLSearchParams(location.search), r=(q.get('r')||'').toUpperCase();
  if(r && netAvailable()){ history.replaceState(null,'',location.pathname); inviteScreen(r); } else intro();
  requestAnimationFrame(loop);
}
boot();
</script>
